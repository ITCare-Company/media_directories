media_directories_editor.settings:
  type: config_object
  label: 'Media Directories Editor settings'
  mapping:
    embed_dialog:
      type: mapping
      label: 'Embed dialog settings'
      mapping:
        image_styles:
          type: sequence
          label: 'List of enabled image styles in embed dialog'
          sequence:
            type: string
            label: 'Image style'

field.formatter.settings.media_directories_image_dimensions:
  type: mapping
  label: 'Image with dimensions format settings'
  mapping:
    dimensions:
      type: mapping
      label: 'Dimension settings'
      mapping:
        image_width:
          type: string
          label: 'Width'
        image_height:
          type: string
          label: 'Height'
